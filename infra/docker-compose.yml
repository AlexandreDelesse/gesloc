services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gesloc
      POSTGRES_USER: gesloc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gesloc"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=gesloc;Username=gesloc;Password=${POSTGRES_PASSWORD}"
      Keycloak__Authority: ${KEYCLOAK_ISSUER}
      Keycloak__Audience: gesloc-frontend
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_KEYCLOAK_URL: ${KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: gesloc
        VITE_KEYCLOAK_CLIENT_ID: gesloc-frontend
    ports:
      - "80:80"

volumes:
  postgres_data:
